<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OROLOGIO GEMINI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #050505;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* PULSANTI AI 4 ANGOLI */
    .corner-btn {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
      z-index: 10;
    }
    .corner-btn:active {
      transform: scale(0.9);
      background: rgba(0, 188, 212, 0.4);
    }
    .top-left { top: 18px; left: 18px; }
    .top-right { top: 18px; right: 18px; }
    .bottom-left { bottom: 18px; left: 18px; }
    .bottom-right { bottom: 18px; right: 18px; }

    /* CONTENITORE OROLOGIO */
    .clock-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 20px;
    }

    /* QUADRANTE DIGITALE */
    .time-digital {
      font-size: clamp(3.8rem, 17vw, 9.5rem);
      font-weight: 800;
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: -2px;
      color: #00bcd4;
      text-shadow: 0 0 30px rgba(0, 188, 212, 0.5);
      line-height: 1;
    }

    .date-display {
      font-size: clamp(1.2rem, 4vw, 2.2rem);
      color: #b0b0b0;
      margin-top: 18px;
      font-weight: 600;
      text-transform: capitalize;
    }

    /* QUADRANTE ANALOGICO */
    .analog-clock {
      width: clamp(250px, 65vw, 420px);
      height: clamp(250px, 65vw, 420px);
      border: 6px solid #00bcd4;
      border-radius: 50%;
      position: relative;
      box-shadow: 0 0 35px rgba(0, 188, 212, 0.3);
      display: none;
      background: rgba(10, 10, 10, 0.8);
    }
    .analog-center {
      width: 16px;
      height: 16px;
      background: #00bcd4;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
    }
    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 6px;
      z-index: 3;
    }
    .hand.hour {
      width: 8px;
      height: 28%;
      background: #ffffff;
      transform: translateX(-50%);
    }
    .hand.minute {
      width: 5px;
      height: 40%;
      background: #00bcd4;
      transform: translateX(-50%);
    }
    .hand.second {
      width: 2px;
      height: 45%;
      background: #ff9800;
      transform: translateX(-50%);
      z-index: 4;
    }

    /* INFO METEO */
    .weather-box {
      margin-top: 15px;
      font-size: 16px;
      color: #ffb74d;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    /* MODALE SETTAGGI GENERALI */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }
    .modal-card {
      background: #181818;
      border: 2px solid #00bcd4;
      border-radius: 20px;
      padding: 22px;
      max-width: 420px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }
    .modal-card h2 {
      color: #00bcd4;
      margin-bottom: 18px;
      font-size: 20px;
    }
    .setting-group {
      background: #222;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      text-align: left;
    }
    .setting-title {
      font-size: 13px;
      color: #00bcd4;
      text-transform: uppercase;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .color-picker-row {
      display: flex;
      justify-content: space-around;
      margin-top: 8px;
    }
    .color-dot {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
    }
    .btn-opt {
      width: 100%;
      padding: 12px;
      background: #333;
      color: white;
      border: 1px solid #555;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-opt.active {
      background: #00bcd4;
      color: #000;
      border-color: #00bcd4;
    }
    .btn-close {
      background: #e53935;
      color: white;
      border: none;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- PULSANTI AI 4 ANGOLI -->
  <button class="corner-btn top-left" onclick="toggleFullscreen()" title="Schermo Intero"><i class="fa-solid fa-expand"></i></button>
  <button class="corner-btn top-right" onclick="openSettings()" title="Settaggi Generali"><i class="fa-solid fa-gear"></i></button>
  <button class="corner-btn bottom-left" onclick="toggleClockStyle()" title="Cambia Vista"><i class="fa-solid fa-rotate"></i></button>
  <button class="corner-btn bottom-right" onclick="toggleWakeLock()" title="Schermo Sempre Acceso"><i id="lock-icon" class="fa-solid fa-lightbulb" style="color:#ffeb3b;"></i></button>

  <!-- OROLOGIO CENTRALE -->
  <div class="clock-container">
    <!-- Digitale -->
    <div id="digital-clock">
      <div id="time-display" class="time-digital">00:00:00</div>
    </div>

    <!-- Analogico -->
    <div id="analog-clock" class="analog-clock">
      <div class="analog-center"></div>
      <div id="hour-hand" class="hand hour"></div>
      <div id="min-hand" class="hand minute"></div>
      <div id="sec-hand" class="hand second"></div>
    </div>

    <div id="date-display" class="date-display">Caricamento data...</div>
    
    <!-- Box Meteo -->
    <div id="weather-box" class="weather-box">
      <i class="fa-solid fa-cloud-sun"></i> <span id="weather-text">Caricamento meteo...</span>
    </div>
  </div>

  <!-- PANNELLO SETTAGGI GENERALI -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-card">
      <h2>⚙️ SETTAGGI GENERALI</h2>

      <!-- Selezione Stile -->
      <div class="setting-group">
        <div class="setting-title">Stile Quadrante</div>
        <button id="btn-mode-digital" class="btn-opt active" onclick="setClockMode('digital')">
          <i class="fa-solid fa-digital-tachograph"></i> DIGITALE
        </button>
        <button id="btn-mode-analog" class="btn-opt" onclick="setClockMode('analog')">
          <i class="fa-solid fa-clock"></i> ANALOGICO
        </button>
      </div>

      <!-- Selezione Colore Neon -->
      <div class="setting-group">
        <div class="setting-title">Colore Cifre e Dettagli</div>
        <div class="color-picker-row">
          <div class="color-dot" style="background: #00bcd4;" onclick="changeColor('#00bcd4')"></div>
          <div class="color-dot" style="background: #ff9800;" onclick="changeColor('#ff9800')"></div>
          <div class="color-dot" style="background: #00e676;" onclick="changeColor('#00e676')"></div>
          <div class="color-dot" style="background: #e91e63;" onclick="changeColor('#e91e63')"></div>
          <div class="color-dot" style="background: #ffffff;" onclick="changeColor('#ffffff')"></div>
        </div>
      </div>

      <!-- Suoni d'Ambiente Rilassanti -->
      <div class="setting-group">
        <div class="setting-title">Suoni d'Ambiente Rilassanti</div>
        <button id="snd-rain" class="btn-opt" onclick="toggleAmbientSound('rain')"><i class="fa-solid fa-cloud-rain"></i> Pioggia</button>
        <button id="snd-forest" class="btn-opt" onclick="toggleAmbientSound('forest')"><i class="fa-solid fa-tree"></i> Bosco</button>
        <button id="snd-waves" class="btn-opt" onclick="toggleAmbientSound('waves')"><i class="fa-solid fa-water"></i> Onde del Mare</button>
        <button id="snd-off" class="btn-opt" onclick="stopAmbientSound()" style="background:#555;"><i class="fa-solid fa-volume-xmark"></i> DISATTIVA SUONI</button>
      </div>

      <button class="btn-close" onclick="closeSettings()">SALVA E CHIUDI</button>
    </div>
  </div>

  <script>
    let clockMode = localStorage.getItem('og_mode') || 'digital';
    let currentColor = localStorage.getItem('og_color') || '#00bcd4';
    let showSeconds = true;
    let wakeLock = null;
    let audioCtx = null;
    let currentSound = null;

    function updateClock() {
      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes();
      const s = now.getSeconds();

      // Aggiorna Digitale
      const hStr = String(h).padStart(2, '0');
      const mStr = String(m).padStart(2, '0');
      const sStr = String(s).padStart(2, '0');
      document.getElementById('time-display').innerText = showSeconds ? `${hStr}:${mStr}:${sStr}` : `${hStr}:${mStr}`;

      // Aggiorna Analogico
      const secDeg = (s / 60) * 360;
      const minDeg = ((m + s / 60) / 60) * 360;
      const hourDeg = ((h % 12 + m / 60) / 12) * 360;

      document.getElementById('sec-hand').style.transform = `translateX(-50%) rotate(${secDeg}deg)`;
      document.getElementById('min-hand').style.transform = `translateX(-50%) rotate(${minDeg}deg)`;
      document.getElementById('hour-hand').style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;

      // Data
      const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
      document.getElementById('date-display').innerText = now.toLocaleDateString('it-IT', options);
    }

    setInterval(updateClock, 1000);
    updateClock();

    function setClockMode(mode) {
      clockMode = mode;
      localStorage.setItem('og_mode', mode);

      const digitalDiv = document.getElementById('digital-clock');
      const analogDiv = document.getElementById('analog-clock');
      const btnDig = document.getElementById('btn-mode-digital');
      const btnAna = document.getElementById('btn-mode-analog');

      if (mode === 'digital') {
        digitalDiv.style.display = 'block';
        analogDiv.style.display = 'none';
        btnDig.classList.add('active');
        btnAna.classList.remove('active');
      } else {
        digitalDiv.style.display = 'none';
        analogDiv.style.display = 'block';
        btnAna.classList.add('active');
        btnDig.classList.remove('active');
      }
    }

    function toggleClockStyle() {
      setClockMode(clockMode === 'digital' ? 'analog' : 'digital');
    }

    function changeColor(color) {
      currentColor = color;
      localStorage.setItem('og_color', color);

      document.getElementById('time-display').style.color = color;
      document.getElementById('time-display').style.textShadow = `0 0 30px ${color}80`;
      document.getElementById('analog-clock').style.borderColor = color;
      document.getElementById('analog-clock').style.boxShadow = `0 0 35px ${color}50`;
      document.getElementById('min-hand').style.background = color;
      document.getElementById('hour-hand').style.background = color;
    }

    setClockMode(clockMode);
    changeColor(currentColor);

    function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    async function toggleWakeLock() {
      try {
        if (!wakeLock && 'wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          document.getElementById('lock-icon').style.color = '#ffeb3b';
        } else if (wakeLock) {
          wakeLock.release();
          wakeLock = null;
          document.getElementById('lock-icon').style.color = '#777777';
        }
      } catch (e) {}
    }

    toggleWakeLock();

    // METEO BASE REALE VIA LOCATION/API
    async function fetchWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=43.5485&longitude=10.3106&current_weather=true');
        const data = await res.json();
        if (data && data.current_weather) {
          const temp = Math.round(data.current_weather.temperature);
          document.getElementById('weather-text').innerText = `Livorno: ${temp}°C`;
        }
      } catch (e) {
        document.getElementById('weather-text').innerText = "Meteo non disponibile";
      }
    }
    fetchWeather();

    // SUONI D'AMBIENTE (SINTETIZZATORE AUDIO NATIVO)
    function toggleAmbientSound(type) {
      stopAmbientSound();
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      whiteNoise.loop = true;

      const filter = audioCtx.createBiquadFilter();
      filter.type = type === 'rain' ? 'lowpass' : (type === 'forest' ? 'bandpass' : 'lowpass');
      filter.frequency.value = type === 'rain' ? 800 : (type === 'forest' ? 1200 : 400);

      const gain = audioCtx.createGain();
      gain.gain.value = 0.15;

      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      whiteNoise.start();
      currentSound = whiteNoise;
    }

    function stopAmbientSound() {
      if (currentSound) {
        currentSound.stop();
        currentSound = null;
      }
    }
  </script>
</body>
</html>
