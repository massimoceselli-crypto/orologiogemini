<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OROLOGIO GEMINI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #050505;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .clock-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 20px;
      text-align: center;
    }

    .time-digital {
      font-size: clamp(3.5rem, 16vw, 9rem);
      font-weight: 800;
      font-family: monospace;
      letter-spacing: -2px;
      color: #00bcd4;
      text-shadow: 0 0 25px rgba(0, 188, 212, 0.4);
      line-height: 1;
    }

    .date-display {
      font-size: clamp(1.1rem, 4vw, 2rem);
      color: #a0a0a0;
      margin-top: 15px;
      font-weight: 500;
      text-transform: capitalize;
    }

    .corner-btn {
      position: absolute;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      z-index: 10;
    }
    .corner-btn:active {
      transform: scale(0.9);
      background: rgba(0, 188, 212, 0.3);
    }

    .top-left { top: 16px; left: 16px; }
    .top-right { top: 16px; right: 16px; }
    .bottom-left { bottom: 16px; left: 16px; }
    .bottom-right { bottom: 16px; right: 16px; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-card {
      background: #181818;
      border: 1px solid #00bcd4;
      border-radius: 16px;
      padding: 20px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .modal-card h3 {
      color: #00bcd4;
      margin-bottom: 15px;
    }
    .color-picker-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 15px 0;
    }
    .color-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .color-dot.active {
      border-color: #fff;
    }

    .btn-close {
      background: #00bcd4;
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <button class="corner-btn top-left" onclick="toggleFullscreen()"><i class="fa-solid fa-expand"></i></button>
  <button class="corner-btn top-right" onclick="openSettings()"><i class="fa-solid fa-palette"></i></button>
  <button class="corner-btn bottom-left" onclick="toggleSeconds()"><i class="fa-solid fa-clock"></i></button>
  <button class="corner-btn bottom-right" onclick="toggleWakeLock()"><i id="lock-icon" class="fa-solid fa-lightbulb" style="color:#ffeb3b;"></i></button>

  <div class="clock-container">
    <div id="time-display" class="time-digital">00:00:00</div>
    <div id="date-display" class="date-display">Caricamento...</div>
  </div>

  <div id="settings-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>Scegli Colore Orologio</h3>
      <div class="color-picker-row">
        <div class="color-dot" style="background: #00bcd4;" onclick="changeColor('#00bcd4')"></div>
        <div class="color-dot" style="background: #ff9800;" onclick="changeColor('#ff9800')"></div>
        <div class="color-dot" style="background: #00e676;" onclick="changeColor('#00e676')"></div>
        <div class="color-dot" style="background: #e91e63;" onclick="changeColor('#e91e63')"></div>
        <div class="color-dot" style="background: #ffffff;" onclick="changeColor('#ffffff')"></div>
      </div>
      <button class="btn-close" onclick="closeSettings()">CHIUDI</button>
    </div>
  </div>

  <script>
    let showSeconds = true;
    let currentColor = localStorage.getItem('og_color') || '#00bcd4';
    let wakeLock = null;

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('time-display').innerText = showSeconds ? `${h}:${m}:${s}` : `${h}:${m}`;

      const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
      document.getElementById('date-display').innerText = now.toLocaleDateString('it-IT', options);
    }

    setInterval(updateClock, 1000);
    updateClock();

    function changeColor(color) {
      currentColor = color;
      localStorage.setItem('og_color', color);
      const display = document.getElementById('time-display');
      display.style.color = color;
      display.style.textShadow = `0 0 25px ${color}66`;
    }

    changeColor(currentColor);

    function toggleSeconds() {
      showSeconds = !showSeconds;
      updateClock();
    }

    function openSettings() {
      document.getElementById('settings-modal').style.display = 'flex';
    }

    function closeSettings() {
      document.getElementById('settings-modal').style.display = 'none';
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    async function toggleWakeLock() {
      try {
        if (!wakeLock && 'wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          document.getElementById('lock-icon').style.color = '#ffeb3b';
        } else if (wakeLock) {
          wakeLock.release();
          wakeLock = null;
          document.getElementById('lock-icon').style.color = '#777777';
        }
      } catch (e) {}
    }

    toggleWakeLock();
  </script>
</body>
</html>
